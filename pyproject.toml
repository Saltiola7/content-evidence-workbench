[project]
name = "content-evidence-workbench"
version = "0.1.0"
description = "Deterministic clean-room content retrieval and evidence review workbench"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Tommi Saltiola" }]
dependencies = [
  "marimo>=0.18.0",
  "numpy>=2.0.0",
  "scikit-learn>=1.6.0",
  "scipy>=1.14.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
